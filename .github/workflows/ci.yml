name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # The SDK version is pinned in global.json so CI and local builds run the same analyzers.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore HashForge.sln

      - name: Build
        run: dotnet build HashForge.sln --configuration Release --no-restore

      - name: Unit tests
        run: dotnet test HashForge.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Build the pool image
        run: docker build --tag hashforge:ci .

      - name: Build the Bitcoin node image
        run: docker build --tag hashforge-bitcoind:ci docker/bitcoind
