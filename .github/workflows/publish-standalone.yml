name: Publish standalone development images
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: standalone-development-publish
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'SoggyHammyDev/HashForge' && github.ref == 'refs/heads/feature/standalone-bitcoin-node'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish pool
        id: pool
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/soggyhammydev/hashforge:standalone-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/SoggyHammyDev/HashForge
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Publish node
        id: node
        uses: docker/build-push-action@v6
        with:
          context: docker/bitcoind
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/soggyhammydev/hashforge-bitcoind:standalone-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/SoggyHammyDev/HashForge
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Report digests
        env:
          POOL_DIGEST: ${{ steps.pool.outputs.digest }}
          NODE_DIGEST: ${{ steps.node.outputs.digest }}
        run: |
          echo "Pool: ghcr.io/soggyhammydev/hashforge:standalone-$GITHUB_SHA@$POOL_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Node: ghcr.io/soggyhammydev/hashforge-bitcoind:standalone-$GITHUB_SHA@$NODE_DIGEST" >> "$GITHUB_STEP_SUMMARY"
