name: Publish image

# Releases the pool as a container image. Pushing a tag such as v0.1.0 builds the image for Intel/AMD
# and ARM and publishes it to the GitHub container registry as ghcr.io/owenashurst/hashforge:0.1.0.
# Packages for platforms that install prebuilt images, such as Umbrel, pin this image by its digest.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, without the leading v (for example 0.1.0)
        required: true

permissions:
  contents: read

concurrency:
  group: publish-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/owenashurst/hashforge

jobs:
  publish:
    name: Build and push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Work out the version
        id: version
        env:
          REQUESTED: ${{ inputs.version }}
        # A tag gives the version when one was pushed; a manual run names it instead.
        run: |
          version="${REQUESTED:-${GITHUB_REF_NAME#v}}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::'$version' is not a version such as 0.1.0"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Sign in to the GitHub container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=HashForge
            org.opencontainers.image.description=Open-source, Bitcoin-only mining pool
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.licenses=MIT

      - name: Report the digest
        # Umbrel and similar packages need the multi-arch digest, so it is printed where it is easy to find.
        run: |
          digest="$(docker buildx imagetools inspect "${IMAGE}:${{ steps.version.outputs.version }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "Published \`${IMAGE}:${{ steps.version.outputs.version }}@${digest}\`" >> "$GITHUB_STEP_SUMMARY"
